<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fan Rush</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Playables SDK must load before game logic. Absent when testing locally; all calls are guarded. -->
<script src="https://www.youtube.com/game_api/v1"></script>
<script>
"use strict";
// ---------- setup ----------
const W = 360, H = 640, PY = 500;           // logical size, player y
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let sc = 1, ox = 0, oy = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  sc = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * sc) / 2;
  oy = (cv.height - H * sc) / 2;
}
addEventListener('resize', resize); resize();

const yt = (typeof ytgame !== 'undefined') ? ytgame : null;

// ---------- save ----------
let level = 1, best = 1;
function persist() {
  const s = JSON.stringify({ level, best });
  try { if (yt && yt.game && yt.game.saveData) { yt.game.saveData(s); return; } } catch (e) {}
  try { localStorage.setItem('fanrush', s); } catch (e) {}
}
function applySave(s) {
  try { const d = JSON.parse(s); if (d && d.level) { level = d.level | 0 || 1; best = Math.max(d.best | 0, level); } } catch (e) {}
}
function loadSave() {
  try {
    if (yt && yt.game && yt.game.loadData) { return Promise.resolve(yt.game.loadData()).then(applySave).catch(() => {}); }
  } catch (e) {}
  try { applySave(localStorage.getItem('fanrush')); } catch (e) {}
  return Promise.resolve();
}

// ---------- audio ----------
let actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended' && !paused) actx.resume();
  return actx;
}
function beep(f, d, type, vol, slide) {
  if (muted || paused) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  good() { [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.14, 'triangle', 0.14), i * 60)); },
  bad()  { beep(220, 0.3, 'sawtooth', 0.1, 0.4); },
  hit()  { beep(160, 0.12, 'square', 0.09, 0.5); },
  tick(i) { beep(300 + Math.min(i, 40) * 14, 0.05, 'square', 0.05); },
  win()  { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.16), i * 90)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'sawtooth', 0.1), i * 120)); },
  tap()  { beep(660, 0.08, 'triangle', 0.1); }
};

// ---------- helpers ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmt(n) { n = Math.round(n); if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K'; return String(n); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ap(n, o) {
  switch (o.o) { case '+': return n + o.v; case '×': return n * o.v; case '-': return Math.max(0, n - o.v); default: return Math.ceil(n / o.v); }
}
const isGood = o => o.o === '+' || o.o === '×';
const label = o => (o.o === '÷' ? '÷' : o.o === '-' ? '−' : o.o) + o.v;

// ---------- level generation ----------
function gen(n) {
  const R = rng(n * 7919 + 13), ents = [];
  let est = 10, p = 420;
  const rows = 7 + Math.min(n, 10);
  const good = () => {
    if (R() < 0.45) return { o: '×', v: (n > 5 && R() < 0.2) ? 3 : 2 };
    return { o: '+', v: Math.max(5, Math.round(est * (0.25 + R() * 0.5))) };
  };
  const bad = () => {
    if (R() < 0.5) return { o: '÷', v: 2 };
    return { o: '-', v: Math.max(3, Math.round(est * (0.2 + R() * 0.3))) };
  };
  for (let i = 0; i < rows; i++) {
    p += 250;
    if (i >= 2 && R() < 0.38) {
      const small = Math.max(2, Math.round(est * (0.1 + R() * 0.15)));
      const big = Math.max(small + 3, Math.round(est * (0.5 + R() * 0.3)));
      const l = R() < 0.5;
      ents.push({ t: 'enemy', p, x: 90, r: 58, c: l ? small : big });
      ents.push({ t: 'enemy', p, x: 270, r: 58, c: l ? big : small });
      est -= small;
    } else {
      let a, b;
      if (R() < 0.7) { a = good(); b = bad(); } else { a = good(); b = good(); }
      est = Math.max(ap(est, a), ap(est, b));
      const l = R() < 0.5;
      ents.push({ t: 'gate', p, L: l ? a : b, R: l ? b : a });
    }
  }
  p += 260;
  const hp = Math.max(8, Math.round(est * (0.5 + Math.min(n, 15) * 0.028)));
  return { ents, boss: { p, hp } };
}

// ---------- state ----------
let state = 'menu', paused = false, lvl = null;
let N = 10, dispN = 10, p0 = 0, px = W / 2, tx = W / 2, bossHp = 0, bossMax = 1, bossT = 0, bossTicks = 0;
let shake = 0, flash = 0, stateT = 0, time = 0;
const parts = [], pops = [];

function startLevel() {
  lvl = gen(level);
  lvl.ents.forEach(e => e.done = false);
  N = 10; dispN = 10; p0 = 0; px = tx = W / 2;
  bossHp = bossMax = lvl.boss.hp; bossTicks = 0; parts.length = 0; pops.length = 0;
  state = 'play';
}
function burst(x, y, col, n, spd) {
  for (let i = 0; i < n && parts.length < 450; i++) {
    const a = Math.random() * 6.283, s = (0.3 + Math.random()) * (spd || 120);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, max: 1, col, s: 2 + Math.random() * 2 });
  }
}
function pop(x, y, txt, col) { pops.push({ x, y, txt, col, life: 1 }); }
const crowdR = () => 8 + 2.2 * Math.sqrt(Math.min(N, 200));

function lose() { state = 'lose'; stateT = 0; sfx.lose(); shake = 14; burst(px, PY, '#5ad7ff', 40, 200); }
function win() {
  state = 'win'; stateT = 0; sfx.win(); flash = 1;
  level++; best = Math.max(best, level); persist();
  try { if (yt && yt.engagement && yt.engagement.sendScore) yt.engagement.sendScore({ value: level - 1 }); } catch (e) {}
  for (let i = 0; i < 120; i++) burst(Math.random() * W, 60 + Math.random() * 120, ['#ffd23f', '#ff5ea8', '#5ad7ff', '#7dff8a'][i & 3], 1, 160);
}

// ---------- update ----------
function update(dt) {
  time += dt; stateT += dt;
  dispN += (N - dispN) * Math.min(1, dt * 12);
  shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt * 2);
  if (state === 'menu') { px += (tx - px) * Math.min(1, dt * 10); }
  if (state === 'play') {
    p0 += (150 + Math.min(level, 10) * 6) * dt;
    px += (tx - px) * Math.min(1, dt * 14); px = clamp(px, 24, W - 24);
    for (const e of lvl.ents) {
      if (e.done || e.p > p0) continue;
      if (e.t === 'gate') {
        const o = px < W / 2 ? e.L : e.R;
        e.done = true; e.hit = px < W / 2 ? 'L' : 'R';
        N = Math.min(1e9, ap(N, o));
        if (isGood(o)) { sfx.good(); burst(px, PY, '#7dff8a', 24, 150); pop(px, PY - 40, label(o), '#7dff8a'); }
        else { sfx.bad(); shake = 6; burst(px, PY, '#ff5a5a', 20, 130); pop(px, PY - 40, label(o), '#ff5a5a'); }
        if (N <= 0) return lose();
      } else {
        e.done = true;
        if (Math.abs(px - e.x) < e.r + crowdR()) {
          const m = Math.min(N, e.c);
          N -= m; e.c -= m; sfx.hit(); shake = 8;
          burst(e.x, PY, '#ff5a5a', 30, 160); pop(px, PY - 40, '−' + fmt(m), '#ff5a5a');
          if (N <= 0) return lose();
        }
      }
    }
    if (lvl.boss.p - p0 <= PY - 190) { state = 'boss'; bossT = 0; }
  } else if (state === 'boss') {
    px += (W / 2 - px) * Math.min(1, dt * 6);
    bossT += dt;
    while (bossT >= 0.05 && state === 'boss') {
      bossT -= 0.05;
      const d = Math.max(1, Math.round(Math.min(N, bossHp) * 0.06));
      N -= d; bossHp -= d; bossTicks++;
      sfx.tick(bossTicks); shake = 2;
      burst(px, 180 + Math.random() * 40, '#5ad7ff', 2, 140);
      if (bossHp <= 0) { bossHp = 0; N = Math.max(N, 0); win(); break; }
      if (N <= 0) { N = 0; lose(); break; }
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 200 * dt;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].life -= dt; pops[i].y -= 40 * dt; if (pops[i].life <= 0) pops.splice(i, 1); }
}

// ---------- drawing ----------
function text(s, x, y, size, col, align) {
  ctx.font = '800 ' + size + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(8,12,30,.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
function dots(cx, cy, n, R, col, jig) {
  const k = Math.min(n, 200); if (k <= 0) return;
  const spread = R / Math.sqrt(k), r = clamp(spread * 0.62, 2, 4.2);
  ctx.fillStyle = col;
  for (let i = 0; i < k; i++) {
    const a = i * 2.39996, d = spread * Math.sqrt(i + 0.5);
    const j = jig ? Math.sin(time * 9 + i * 1.7) * 1.2 : 0;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d + j, cy + Math.sin(a) * d + (jig ? Math.cos(time * 8 + i) * 1.2 : 0), r, 0, 6.283); ctx.fill();
  }
}
function face(x, y, r) {
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x - r * .32, y - r * .12, r * .2, 0, 6.283); ctx.arc(x + r * .32, y - r * .12, r * .2, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#220';
  ctx.beginPath(); ctx.arc(x - r * .3, y - r * .08, r * .09, 0, 6.283); ctx.arc(x + r * .3, y - r * .08, r * .09, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#220'; ctx.lineWidth = r * .1; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * .55, y - r * .42); ctx.lineTo(x - r * .12, y - r * .3);
  ctx.moveTo(x + r * .55, y - r * .42); ctx.lineTo(x + r * .12, y - r * .3);
  ctx.moveTo(x - r * .3, y + r * .4); ctx.quadraticCurveTo(x, y + r * .22, x + r * .3, y + r * .4); ctx.stroke();
}
const sy = p => PY - (p - p0);

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#070a18'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = shake ? (Math.random() - .5) * shake : 0, sh = shake ? (Math.random() - .5) * shake : 0;
  ctx.setTransform(sc, 0, 0, sc, ox + sx * sc, oy + sh * sc);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1b2a5e'); g.addColorStop(1, '#0f1736');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // lane stripes
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  const off = p0 % 80;
  for (let y = -80 + off; y < H; y += 80) ctx.fillRect(W / 2 - 2, y, 4, 40);
  ctx.fillStyle = 'rgba(90,215,255,.12)'; ctx.fillRect(0, 0, 6, H); ctx.fillRect(W - 6, 0, 6, H);

  if (lvl) {
    for (const e of lvl.ents) {
      const y = sy(e.p); if (y < -80 || y > H + 80) continue;
      if (e.t === 'gate') {
        for (const side of [0, 1]) {
          const o = side ? e.R : e.L, x = side ? 184 : 8, gd = isGood(o);
          ctx.globalAlpha = e.done ? (e.hit === (side ? 'R' : 'L') ? .25 : .5) : 1;
          ctx.fillStyle = gd ? 'rgba(40,140,255,.85)' : 'rgba(255,60,80,.85)';
          ctx.beginPath(); ctx.roundRect(x, y - 30, 168, 60, 12); ctx.fill();
          ctx.strokeStyle = gd ? '#9fd0ff' : '#ffb0b8'; ctx.lineWidth = 3; ctx.stroke();
          text(label(o), x + 84, y, 34, '#fff');
          ctx.globalAlpha = 1;
        }
      } else if (e.c > 0) {
        ctx.fillStyle = 'rgba(255,60,80,.18)'; ctx.beginPath(); ctx.arc(e.x, y, e.r, 0, 6.283); ctx.fill();
        dots(e.x, y, e.c, e.r - 8, '#ff4a5e', true);
        text(fmt(e.c), e.x, y - e.r - 12, 22, '#ff8d99');
      }
    }
    // boss
    const by = Math.max(sy(lvl.boss.p), -120);
    if (by > -140) {
      const pulse = 1 + Math.sin(time * 6) * 0.03, R = 66 * pulse;
      ctx.fillStyle = '#c4162d'; ctx.beginPath(); ctx.arc(W / 2, by, R, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#ff7b8a'; ctx.lineWidth = 5; ctx.stroke();
      if (bossHp > 0) face(W / 2, by, R);
      const frac = clamp(bossHp / bossMax, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.roundRect(60, by - R - 34, 240, 16, 8); ctx.fill();
      ctx.fillStyle = '#ff4a5e'; ctx.beginPath(); ctx.roundRect(60, by - R - 34, 240 * frac, 16, 8); ctx.fill();
      text(fmt(bossHp), W / 2, by + R + 22, 26, '#ff8d99');
    }
  }
  // crowd
  if (state !== 'lose') {
    const n = Math.max(1, Math.round(dispN)), R = 8 + 2.2 * Math.sqrt(Math.min(n, 200));
    dots(px, PY, n, R, '#5ad7ff', true);
    text(fmt(dispN), px, PY - R - 16, 26, '#bff0ff');
  }
  for (const q of parts) { ctx.globalAlpha = clamp(q.life * 2, 0, 1); ctx.fillStyle = q.col; ctx.fillRect(q.x, q.y, q.s, q.s); }
  ctx.globalAlpha = 1;
  for (const o of pops) { ctx.globalAlpha = clamp(o.life * 2, 0, 1); text(o.txt, o.x, o.y, 28, o.col); }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flash * .5) + ')'; ctx.fillRect(0, 0, W, H); }

  // HUD
  if (state === 'play' || state === 'boss') {
    text('LEVEL ' + level, W / 2, 28, 20, '#fff');
    const prog = state === 'boss' ? 1 : clamp(p0 / (lvl.boss.p - (PY - 190)), 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(40, 48, 280, 6);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(40, 48, 280 * prog, 6);
  }
  // overlays
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(7,10,24,.55)'; ctx.fillRect(0, 0, W, H);
    text('FAN RUSH', W / 2, 150, 54, '#5ad7ff');
    text('Grow your crowd.', W / 2, 205, 22, '#fff');
    text('Crush the Mega Hater.', W / 2, 235, 22, '#ff8d99');
    text('Drag to steer', W / 2, 330, 20, '#ffd23f');
    text('Pick blue gates, dodge red', W / 2, 360, 18, '#cfe6ff');
    const s = 1 + Math.sin(time * 5) * 0.05;
    ctx.save(); ctx.translate(W / 2, 450); ctx.scale(s, s); text('TAP TO PLAY', 0, 0, 36, '#7dff8a'); ctx.restore();
    text('Level ' + level + '  ·  Best ' + best, W / 2, 520, 18, '#cfe6ff');
  } else if (state === 'win' || state === 'lose') {
    ctx.fillStyle = 'rgba(7,10,24,.45)'; ctx.fillRect(0, 0, W, H);
    if (state === 'win') { text('YOU WIN!', W / 2, 250, 56, '#ffd23f'); text('Fans left: ' + fmt(N), W / 2, 305, 22, '#bff0ff'); }
    else { text('CANCELLED', W / 2, 250, 52, '#ff5a5a'); text('The haters won this time', W / 2, 300, 20, '#fff'); }
    if (stateT > 0.6) {
      const s = 1 + Math.sin(time * 5) * 0.05;
      ctx.save(); ctx.translate(W / 2, 400); ctx.scale(s, s); text(state === 'win' ? 'NEXT LEVEL' : 'TRY AGAIN', 0, 0, 34, '#7dff8a'); ctx.restore();
    }
  }
  ctx.restore();
}

// ---------- input ----------
function toX(e) { return clamp(((e.clientX * dpr) - ox) / sc, 24, W - 24); }
let down = false;
cv.addEventListener('pointerdown', e => {
  down = true; tx = toX(e); audio();
  if (state === 'menu') { sfx.tap(); startLevel(); }
  else if ((state === 'win' || state === 'lose') && stateT > 0.6) { sfx.tap(); startLevel(); }
});
cv.addEventListener('pointermove', e => { if (down || e.pointerType === 'mouse') tx = toX(e); });
addEventListener('pointerup', () => { down = false; });
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') {
    if (state === 'menu' || ((state === 'win' || state === 'lose') && stateT > 0.6)) { audio(); startLevel(); }
  }
});
addEventListener('keyup', e => { keys[e.key] = false; });

// ---------- lifecycle (Playables) ----------
function setPaused(v) {
  paused = v;
  if (actx) { try { v ? actx.suspend() : (!muted && actx.resume()); } catch (e) {} }
}
try {
  if (yt && yt.system) {
    yt.system.onPause(() => setPaused(true));
    yt.system.onResume(() => setPaused(false));
    muted = !yt.system.isAudioEnabled();
    yt.system.onAudioEnabledChange(on => { muted = !on; if (actx) { try { muted ? actx.suspend() : actx.resume(); } catch (e) {} } });
  }
} catch (e) {}
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); else if (!yt) setPaused(false); });

// ---------- loop ----------
let last = performance.now(), firstFrame = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    if (keys.ArrowLeft || keys.a) tx = clamp(tx - 300 * dt, 24, W - 24);
    if (keys.ArrowRight || keys.d) tx = clamp(tx + 300 * dt, 24, W - 24);
    update(dt);
  }
  draw();
  if (!firstFrame) {
    firstFrame = true;
    try { if (yt && yt.game) { yt.game.firstFrameReady(); yt.game.gameReady(); } } catch (e) {}
  }
  requestAnimationFrame(frame);
}
loadSave().then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
