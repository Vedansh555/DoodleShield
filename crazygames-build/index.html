// CrazyGames SDK: init, gameplay events, mute setting, midgame ads at natural breaks, SDK saves
const CGS=(window.CrazyGames&&window.CrazyGames.SDK)||null;let cgOk=false,adBusy=false,gpOn=false,cgMute=false;
function applyMute(){if(actx)try{muted?actx.suspend():actx.resume()}catch(e){}}
function cgInit(){if(!CGS)return Promise.resolve();return Promise.resolve().then(()=>CGS.init()).then(()=>{cgOk=true;
  try{cgMute=!!CGS.game.settings.muteAudio;if(cgMute)muted=true;CGS.game.addSettingsChangeListener(s=>{cgMute=!!s.muteAudio;muted=cgMute||adBusy;applyMute()})}catch(e){}
  try{CGS.game.loadingStart()}catch(e){}}).catch(()=>{cgOk=false})}
function cgReady(){if(cgOk)try{CGS.game.loadingStop()}catch(e){}}
function cgGameplay(){if(!cgOk)return;const want=!paused&&!adBusy&&(st==='draw'||st==='play');if(want!==gpOn){gpOn=want;try{want?CGS.game.gameplayStart():CGS.game.gameplayStop()}catch(e){}}}
function adDone(){if(!adBusy)return;adBusy=false;muted=cgMute;applyMute();start()}
function nextLevel(){if(!cgOk){start();return}
  adBusy=true;try{CGS.ad.requestAd('midgame',{adStarted:()=>{muted=true;applyMute()},adFinished:adDone,adError:adDone})}catch(e){adDone();return}
  setTimeout(adDone,30000)}
